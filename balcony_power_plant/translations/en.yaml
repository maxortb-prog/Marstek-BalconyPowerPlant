configuration:
  device_ip:
    name: "Device IP"
    description: "IP address of the Marstek device (static IP recommended)."
  device_udp_port:
    name: "Device UDP port"
    description: "Open API UDP port set in the Marstek app (default 30000)."
  device_ble_mac:
    name: "Device BLE MAC"
    description: "Leave empty: filled in automatically after the first successful read."
  device_type:
    name: "Device type"
    description: "Leave empty: filled in automatically after the first successful read."
  udp_local_port:
    name: "Local UDP port"
    description: "Local port for answers. 0 = any free port. Set to 30000 if the device always answers to its own port."
  max_power:
    name: "Maximum power"
    description: "Limit for the passive power slider in W (800 or 1200)."
  mqtt_host:
    name: "MQTT host"
    description: "Broker host, e.g. core-mosquitto (or 127.0.0.1)."
  mqtt_port:
    name: "MQTT port"
    description: "Broker port."
  mqtt_username:
    name: "MQTT username"
  mqtt_password:
    name: "MQTT password"
  mqtt_discovery_prefix:
    name: "MQTT discovery prefix"
    description: "Home Assistant discovery prefix."
  mqtt_base_topic:
    name: "MQTT base topic"
    description: "Base topic for states and commands."
  mqtt_suggested_area:
    name: "Suggested area"
    description: "Area suggested for the HA device."
  queue_enabled:
    name: "Request queue"
    description: "ON: send one after another with delay/timeout/retries. OFF: send immediately (fire mode)."
  request_delay:
    name: "Request delay"
    description: "Seconds between two requests (queue mode)."
  request_timeout:
    name: "Request timeout"
    description: "Seconds to wait for an answer."
  request_retries:
    name: "Request retries"
    description: "0 = no watchdog. >0 = after this many failed retries Communication goes to FAIL (queue mode only)."
  dod:
    name: "Depth of discharge"
    description: "DOD in % (30-88). Sent at every start."
  led:
    name: "LED"
    description: "LED on/off. Sent at every start."
  ble_adv:
    name: "Bluetooth advertising"
    description: "Bluetooth advertising on/off. Sent at every start."
  passive_power:
    name: "Passive power"
    description: "W, positive = feed in, negative = charge."
  passive_cd_time:
    name: "Passive countdown"
    description: "Seconds the passive power stays active (cd_time)."
  query_device:
    name: "Enable device info"
    description: "Marstek.GetDevice"
  query_wifi:
    name: "Enable WiFi status"
    description: "Wifi.GetStatus"
  query_ble:
    name: "Enable Bluetooth status"
    description: "BLE.GetStatus"
  query_battery:
    name: "Enable battery status"
    description: "Bat.GetStatus"
  query_pv:
    name: "Enable PV status"
    description: "PV.GetStatus"
  query_es_status:
    name: "Enable energy system status"
    description: "ES.GetStatus"
  query_es_mode:
    name: "Enable energy system mode"
    description: "ES.GetMode"
  lf_enabled:
    name: "Load following"
    description: "Regulate the battery output to the grid sensor (no feed-in). Also switchable in HA."
  lf_sensor_topic:
    name: "Grid sensor topic"
    description: "MQTT topic with the grid power in W (positive = import, negative = export). Plain number or JSON."
  lf_export_reaction:
    name: "Export reaction"
    description: "Calculated: setpoint = estimated load - target. Minimum: drop to minimum power."
  lf_target_power:
    name: "Target grid power"
    description: "W, regulation target (slight import)."
  lf_deadband_upper:
    name: "Deadband upper"
    description: "W, above: regulate up."
  lf_deadband_lower:
    name: "Deadband lower"
    description: "W, below: regulate down."
  lf_min_power:
    name: "Minimum power"
    description: "W, a lower setpoint is sent as 0 W."
  lf_ramp_step:
    name: "Ramp up step"
    description: "W, max. increase per step."
  lf_settle_time:
    name: "Settle time"
    description: "s, wait after each setpoint change."
  lf_settle_per_100w:
    name: "Settle time per 100 W"
    description: "s added per 100 W of setpoint change (the device ramps, big steps take longer)."
  lf_avg_up:
    name: "Averaging time regulate up"
    description: "s, average of the grid power for regulating up."
  lf_avg_down:
    name: "Averaging time regulate down"
    description: "s, average of the grid power for regulating down."
  lf_cd_time:
    name: "Countdown cd_time"
    description: "s, cd_time sent with every setpoint."
  lf_keepalive_pct:
    name: "Keepalive at"
    description: "% of cd_time after which the setpoint is re-sent."
  lf_sensor_timeout:
    name: "Sensor timeout"
    description: "s without sensor value -> minimum power."
  lf_dropout_detect:
    name: "Dropout detection"
    description: "Detect the device falling out of regulation (grid jumps up by ~setpoint) and hold the setpoint instead of regulating up."
  lf_dropout_resend:
    name: "Dropout resend setpoint"
    description: "Re-send the setpoint immediately when a dropout is detected."
  lf_dropout_tolerance:
    name: "Dropout tolerance"
    description: "W, tolerance = max(W, % of setpoint)."
  lf_dropout_tolerance_pct:
    name: "Dropout tolerance percent"
    description: "% of the setpoint, tolerance = max(W, %)."
  lf_dropout_hold:
    name: "Dropout hold time"
    description: "s to wait for recovery, then regulate normally."
  lf_jitter:
    name: "Keepalive jitter"
    description: "Test: each keep-alive lowers the setpoint by Jitter amount %, checks that the device follows, then returns."
  lf_jitter_pct:
    name: "Jitter amount"
    description: "% of the active setpoint (only downwards)."
  lf_jitter_interval:
    name: "Jitter interval"
    description: "s between two jitter tests (independent of the keep-alive)."
  lf_device_test_guard:
    name: "Device test guard"
    description: "Freeze the regulation while the device runs its own sensor test / reset (detected by a very slow or missing ES.SetMode answer)."
  lf_device_test_hold:
    name: "Device test hold time"
    description: "s, maximum freeze time of the device test guard."
  log_level:
    name: "Log level"
    description: "trace, debug, info, warning, error"
