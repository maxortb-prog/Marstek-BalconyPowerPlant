configuration:
  device_ip:
    name: "Geräte-IP"
    description: "IP-Adresse des Marstek-Geräts (statische IP empfohlen)."
  device_udp_port:
    name: "UDP-Port des Geräts"
    description: "In der Marstek-App eingestellter Open-API-Port (Standard 30000)."
  device_ble_mac:
    name: "BLE-MAC des Geräts"
    description: "Leer lassen: wird nach dem ersten Auslesen automatisch eingetragen."
  device_type:
    name: "Gerätetyp"
    description: "Leer lassen: wird nach dem ersten Auslesen automatisch eingetragen."
  udp_local_port:
    name: "Lokaler UDP-Port"
    description: "Lokaler Port für Antworten. 0 = beliebiger freier Port. 30000 eintragen, falls das Gerät immer an diesen Port antwortet."
  max_power:
    name: "Maximale Leistung"
    description: "Grenze für den Passive-Leistungs-Slider in W (800 oder 1200)."
  mqtt_host:
    name: "MQTT-Host"
    description: "Broker-Host, z. B. core-mosquitto (oder 127.0.0.1)."
  mqtt_port:
    name: "MQTT-Port"
    description: "Broker-Port."
  mqtt_username:
    name: "MQTT-Benutzer"
  mqtt_password:
    name: "MQTT-Passwort"
  mqtt_discovery_prefix:
    name: "MQTT-Discovery-Präfix"
    description: "Discovery-Präfix von Home Assistant."
  mqtt_base_topic:
    name: "MQTT-Basis-Topic"
    description: "Basis-Topic für Zustände und Befehle."
  mqtt_suggested_area:
    name: "Vorgeschlagener Bereich"
    description: "Vorgeschlagener Bereich für das HA-Gerät."
  queue_enabled:
    name: "Anfrage-Queue"
    description: "EIN: nacheinander mit Delay/Timeout/Retries senden. AUS: sofort senden (Fire-Modus)."
  request_delay:
    name: "Anfrage-Abstand"
    description: "Sekunden zwischen zwei Anfragen (Queue-Modus)."
  request_timeout:
    name: "Anfrage-Timeout"
    description: "Sekunden Wartezeit auf eine Antwort."
  request_retries:
    name: "Anfrage-Wiederholungen"
    description: "0 = kein Watchdog. >0 = nach so vielen erfolglosen Wiederholungen geht Communication auf FAIL (nur Queue-Modus)."
  dod:
    name: "Entladetiefe"
    description: "DOD in % (30-88). Wird bei jedem Start gesendet."
  led:
    name: "LED"
    description: "LED ein/aus. Wird bei jedem Start gesendet."
  ble_adv:
    name: "Bluetooth-Advertising"
    description: "Bluetooth-Advertising ein/aus. Wird bei jedem Start gesendet."
  passive_power:
    name: "Passive-Leistung"
    description: "W, positiv = einspeisen, negativ = laden."
  passive_cd_time:
    name: "Passive-Nachlaufzeit"
    description: "Sekunden, die die Passive-Leistung aktiv bleibt (cd_time)."
  query_device:
    name: "Geräteinfo aktiv"
    description: "Marstek.GetDevice"
  query_wifi:
    name: "WLAN-Status aktiv"
    description: "Wifi.GetStatus"
  query_ble:
    name: "Bluetooth-Status aktiv"
    description: "BLE.GetStatus"
  query_battery:
    name: "Batteriestatus aktiv"
    description: "Bat.GetStatus"
  query_pv:
    name: "PV-Status aktiv"
    description: "PV.GetStatus"
  query_es_status:
    name: "Energiesystem-Status aktiv"
    description: "ES.GetStatus"
  query_es_mode:
    name: "Energiesystem-Modus aktiv"
    description: "ES.GetMode"
  lf_enabled:
    name: "Load following (Lastfolgeregelung)"
    description: "Batterieausgabe nach dem Netzsensor regeln (keine Einspeisung). Auch in HA schaltbar."
  lf_sensor_topic:
    name: "Netzsensor-Topic"
    description: "MQTT-Topic mit der Netzleistung in W (positiv = Bezug, negativ = Einspeisung). Zahl oder JSON."
  lf_export_reaction:
    name: "Reaktion auf Einspeisung"
    description: "Calculated: Sollwert = geschätzte Last - Ziel. Minimum: auf Minimum-Leistung fallen."
  lf_target_power:
    name: "Ziel-Netzleistung"
    description: "W, Regelziel (leichter Bezug)."
  lf_deadband_upper:
    name: "Totband oben"
    description: "W, darüber: hochregeln."
  lf_deadband_lower:
    name: "Totband unten"
    description: "W, darunter: runterregeln."
  lf_min_power:
    name: "Minimum-Leistung"
    description: "W, ein kleinerer Sollwert wird als 0 W gesendet."
  lf_ramp_step:
    name: "Rampe hochregeln"
    description: "W, max. Erhöhung je Schritt."
  lf_settle_time:
    name: "Einschwingzeit"
    description: "s, Wartezeit nach jeder Sollwertänderung."
  lf_settle_per_100w:
    name: "Einschwingzeit pro 100 W"
    description: "s zusätzlich je 100 W Sollwertänderung (das Gerät rampt, große Sprünge dauern länger)."
  lf_avg_up:
    name: "Mittelwert hochregeln"
    description: "s, Mittelwert der Netzleistung fürs Hochregeln."
  lf_avg_down:
    name: "Mittelwert runterregeln"
    description: "s, Mittelwert der Netzleistung fürs Runterregeln."
  lf_cd_time:
    name: "Nachlaufzeit cd_time"
    description: "s, cd_time bei jedem Sollwert."
  lf_keepalive_pct:
    name: "Keepalive bei"
    description: "% der cd_time, nach denen der Sollwert erneut gesendet wird."
  lf_sensor_timeout:
    name: "Sensor-Timeout"
    description: "s ohne Sensorwert -> Minimum-Leistung."
  lf_dropout_detect:
    name: "Dropout-Erkennung"
    description: "Erkennt, wenn das Gerät aus der Regelung fällt (Netz springt um ~Sollwert), und hält den Sollwert statt hochzuregeln."
  lf_dropout_resend:
    name: "Sollwert bei Dropout erneut senden"
    description: "Sollwert bei erkanntem Dropout sofort erneut senden."
  lf_dropout_tolerance:
    name: "Dropout-Toleranz"
    description: "W, Toleranz = max(W, % vom Sollwert)."
  lf_dropout_tolerance_pct:
    name: "Dropout-Toleranz Prozent"
    description: "% vom Sollwert, Toleranz = max(W, %)."
  lf_dropout_hold:
    name: "Dropout-Haltezeit"
    description: "s Wartezeit auf Wiederkehr, danach normale Regelung."
  lf_jitter:
    name: "Keepalive-Jitter"
    description: "Test: Jeder Keepalive senkt den Sollwert um Jitter amount %, prüft ob das Gerät folgt, und kehrt zurück."
  lf_jitter_pct:
    name: "Jitter-Betrag"
    description: "% vom aktiven Sollwert (nur nach unten)."
  lf_jitter_interval:
    name: "Jitter-Intervall"
    description: "s zwischen zwei Jitter-Tests (unabhängig vom Keepalive)."
  lf_device_test_guard:
    name: "Geräte-Test-Schutz"
    description: "Regelung einfrieren, während das Gerät seinen eigenen Sensortest / Reset fährt (erkannt an sehr langsamer oder fehlender ES.SetMode-Antwort)."
  lf_device_test_hold:
    name: "Geräte-Test Haltezeit"
    description: "s, maximale Einfrierzeit des Geräte-Test-Schutzes."
  log_level:
    name: "Log-Level"
    description: "trace, debug, info, warning, error"
